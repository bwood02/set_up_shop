name: Nightly fraud model retrain

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ml.txt

      - name: Train from Supabase Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/train_fraud_model.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: fraud_model
          path: models/fraud_model.joblib

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/fraud_model.joblib
          git diff --cached --quiet && echo "No model changes" && exit 0
          git commit -m "chore: nightly fraud model retrain [skip ci]"
          git push
